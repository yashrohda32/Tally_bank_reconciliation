<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tally Bank Reconciliation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:16px;
}

h1{text-align:center}

.card{
    background:white;
    padding:18px;
    margin:15px 0;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input[type=file]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    background:#888;
}

#status{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:8px;
    background:#eef4ff;
}

.success{
    background:#e9f8ed!important;
    color:#08752b;
}

.error{
    background:#ffe9e9!important;
    color:#a00000;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.box{
    background:#f4f5f6;
    padding:15px;
    text-align:center;
    border-radius:10px;
}

.box b{
    display:block;
    font-size:25px;
    margin-top:5px;
}

.tableBox{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,td{
    border:1px solid #ddd;
    padding:9px;
    font-size:13px;
}

th{
    background:#eee;
}

.MATCHED{
    color:green;
    font-weight:bold;
}

.POSSIBLE{
    color:#b36b00;
    font-weight:bold;
}

.MISSING{
    color:red;
    font-weight:bold;
}

pre{
    background:#111;
    color:white;
    padding:12px;
    border-radius:8px;
    overflow:auto;
    max-height:300px;
}

@media(max-width:600px){
    .summary{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🏦 Tally Bank Reconciliation</h1>

<div class="card">

<label>1️⃣ Tally Bank Statement</label>

<input
    id="tallyFile"
    type="file"
    accept=".pdf,application/pdf"
>

</div>

<div class="card">

<label>2️⃣ Original Bank Statement</label>

<input
    id="bankFile"
    type="file"
    accept=".pdf,application/pdf"
>

</div>

<div class="card">

<button
    id="analyzeBtn"
    type="button"
    onclick="startAnalysis()"
>
🔍 Analyze & Match Entries
</button>

<div id="status"></div>

</div>

<div id="result"></div>

</div>


<script>

/* =====================================
   BASIC SETUP
===================================== */

if(typeof pdfjsLib !== "undefined"){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}


/* =====================================
   STATUS
===================================== */

function showStatus(message,type){

    var box =
        document.getElementById("status");

    box.style.display = "block";

    box.className = "";

    if(type){
        box.classList.add(type);
    }

    box.innerText = message;
}


/* =====================================
   READ PDF
===================================== */

async function readPDF(file,name){

    if(!file){
        throw new Error(name + " PDF select nahi ki gayi.");
    }

    if(typeof pdfjsLib === "undefined"){
        throw new Error(
            "PDF reader load nahi hua. Internet ON karke app dobara open karein."
        );
    }

    showStatus(
        "📖 " + name + " PDF read ho raha hai..."
    );

    var buffer =
        await file.arrayBuffer();

    var pdf =
        await pdfjsLib.getDocument({
            data:buffer
        }).promise;

    var allText = "";

    for(
        var pageNo=1;
        pageNo<=pdf.numPages;
        pageNo++
    ){

        showStatus(
            "📖 " +
            name +
            " - Page " +
            pageNo +
            " / " +
            pdf.numPages
        );

        var page =
            await pdf.getPage(pageNo);

        var content =
            await page.getTextContent();

        var items =
            content.items || [];

        var lines = {};

        items.forEach(function(item){

            var text =
                (item.str || "").trim();

            if(!text) return;

            var y =
                Math.round(item.transform[5]);

            if(!lines[y]){
                lines[y] = [];
            }

            lines[y].push({
                x:item.transform[4],
                text:text
            });

        });

        var ys =
            Object.keys(lines)
            .map(Number)
            .sort(function(a,b){
                return b-a;
            });

        ys.forEach(function(y){

            lines[y].sort(function(a,b){
                return a.x-b.x;
            });

            allText +=
                lines[y]
                .map(function(x){
                    return x.text;
                })
                .join(" ") +
                "\n";
        });

        allText += "\n";
    }

    return allText;
}


/* =====================================
   DATE
===================================== */

function getDate(text){

    var patterns = [

        /(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/,

        /(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})/

    ];

    for(var i=0;i<patterns.length;i++){

        var m =
            text.match(patterns[i]);

        if(m){

            var d =
                parseInt(m[1]);

            var month =
                parseInt(m[2]);

            var year =
                parseInt(m[3]);

            if(year<100){
                year += 2000;
            }

            if(
                d>=1 &&
                d<=31 &&
                month>=1 &&
                month<=12
            ){

                return new Date(
                    year,
                    month-1,
                    d
                );
            }
        }
    }

    return null;
}


/* =====================================
   AMOUNT
===================================== */

function getAmounts(text){

    var matches =
        text.match(
            /(?:₹|Rs\.?|INR)?\s*\d[\d,]*(?:\.\d{1,2})?/gi
        ) || [];

    var values=[];

    matches.forEach(function(x){

        x =
            x.replace(/₹/g,"")
             .replace(/Rs\.?/ig,"")
             .replace(/INR/ig,"")
             .replace(/,/g,"")
             .trim();

        var n =
            parseFloat(x);

        if(!isNaN(n) && n>0){
            values.push(n);
        }

    });

    return values;
}


/* =====================================
   TYPE
===================================== */

function getType(text){

    var t =
        text.toLowerCase();

    if(
        t.includes("withdraw") ||
        t.includes("debit") ||
        t.includes(" dr") ||
        /\bby\b/.test(t)
    ){
        return "DEBIT";
    }

    if(
        t.includes("deposit") ||
        t.includes("credit") ||
        t.includes(" cr") ||
        /\bto\b/.test(t)
    ){
        return "CREDIT";
    }

    return "";
}


/* =====================================
   TRANSACTIONS
===================================== */

function detectTransactions(text){

    var lines =
        text.split(/\r?\n/)
        .map(function(x){
            return x.trim();
        })
        .filter(function(x){
            return x.length>0;
        });

    var entries=[];
    var current=null;

    lines.forEach(function(line){

        var date =
            getDate(line);

        if(date){

            if(current){
                saveEntry(
                    current,
                    entries
                );
            }

            current={
                date:date,
                dateText:line,
                text:line
            };

        }else if(current){

            current.text +=
                " " + line;
        }

    });

    if(current){
        saveEntry(
            current,
            entries
        );
    }

    return removeDuplicates(entries);
}


/* =====================================
   SAVE ENTRY
===================================== */

function saveEntry(entry,list){

    var amounts =
        getAmounts(entry.text);

    if(amounts.length===0){
        return;
    }

    entry.amount =
        amounts[amounts.length-1];

    entry.type =
        getType(entry.text);

    list.push(entry);
}


/* =====================================
   DUPLICATES
===================================== */

function removeDuplicates(list){

    var seen={};

    return list.filter(function(e){

        var key =
            e.dateText +
            "|" +
            e.amount +
            "|" +
            e.type;

        if(seen[key]){
            return false;
        }

        seen[key]=true;

        return true;
    });
}


/* =====================================
   DATE DIFFERENCE
===================================== */

function dateDifference(a,b){

    if(!a || !b){
        return 999;
    }

    return Math.abs(
        a.getTime()-b.getTime()
    )/(1000*60*60*24);
}


/* =====================================
   MATCH
===================================== */

function matchEntries(tally,bank){

    var results=[];
    var used={};

    tally.forEach(function(t){

        var best=null;
        var bestScore=0;
        var bestIndex=-1;

        bank.forEach(function(b,index){

            if(used[index]){
                return;
            }

            if(
                Math.abs(
                    t.amount-b.amount
                ) > 0.01
            ){
                return;
            }

            var score=60;

            var diff =
                dateDifference(
                    t.date,
                    b.date
                );

            if(diff===0){
                score+=25;
            }else if(diff<=2){
                score+=15;
            }

            if(
                t.type &&
                b.type &&
                t.type===b.type
            ){
                score+=10;
            }

            if(score>bestScore){

                bestScore=score;
                best=b;
                bestIndex=index;
            }

        });

        if(best){

            used[bestIndex]=true;

            var status =
                bestScore>=80
                ? "MATCHED"
                : "POSSIBLE";

            results.push({
                tally:t,
                bank:best,
                score:bestScore,
                status:status
            });

        }else{

            results.push({
                tally:t,
                bank:null,
                score:0,
                status:"MISSING"
            });

        }

    });

    var extra=[];

    bank.forEach(function(b,index){

        if(!used[index]){
            extra.push(b);
        }

    });

    return {
        results:results,
        extra:extra
    };
}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(date){

    if(!date) return "-";

    return String(
        date.getDate()
    ).padStart(2,"0")
    + "/" +
    String(
        date.getMonth()+1
    ).padStart(2,"0")
    + "/" +
    date.getFullYear();
}


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(text){

    return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


/* =====================================
   SHOW RESULTS
===================================== */

function showResults(tally,bank,data){

    var matched=0;
    var possible=0;
    var missing=0;

    data.results.forEach(function(r){

        if(r.status==="MATCHED"){
            matched++;
        }else if(r.status==="POSSIBLE"){
            possible++;
        }else{
            missing++;
        }

    });

    var html = `

    <div class="card">

        <h2>📊 Summary</h2>

        <div class="summary">

            <div class="box">
                Tally Entries
                <b>${tally.length}</b>
            </div>

            <div class="box">
                Bank Entries
                <b>${bank.length}</b>
            </div>

            <div class="box">
                Matched
                <b>${matched}</b>
            </div>

        </div>

        <br>

        <div class="summary">

            <div class="box">
                Possible
                <b>${possible}</b>
            </div>

            <div class="box">
                Missing
                <b>${missing}</b>
            </div>

            <div class="box">
                Extra Bank
                <b>${data.extra.length}</b>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>📋 Tally vs Bank</h2>

        <div class="tableBox">

        <table>

        <tr>
            <th>#</th>
            <th>Tally Date</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Bank Date</th>
            <th>Status</th>
            <th>Score</th>
        </tr>
    `;

    data.results.forEach(function(r,i){

        html += `

        <tr>

            <td>${i+1}</td>

            <td>
                ${formatDate(r.tally.date)}
            </td>

            <td>
                ₹${r.tally.amount.toFixed(2)}
            </td>

            <td>
                ${escapeHTML(r.tally.type)}
            </td>

            <td>
                ${
                    r.bank
                    ? formatDate(r.bank.date)
                    : "-"
                }
            </td>

            <td class="${r.status}">
                ${r.status}
            </td>

            <td>${r.score}</td>

        </tr>
        `;

    });

    html += `

        </table>

        </div>

    </div>
    `;


    html += `

    <div class="card">

        <h2>🔎 Detected Tally Entries</h2>

        <div class="tableBox">

        <table>

        <tr>
            <th>#</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Narration</th>
        </tr>
    `;

    tally.forEach(function(e,i){

        html += `

        <tr>

            <td>${i+1}</td>

            <td>${formatDate(e.date)}</td>

            <td>₹${e.amount.toFixed(2)}</td>

            <td>${escapeHTML(e.type)}</td>

            <td>${escapeHTML(e.text)}</td>

        </tr>
        `;

    });

    html += `

        </table>

        </div>

    </div>
    `;


    html += `

    <div class="card">

        <h2>🏦 Detected Bank Entries</h2>

        <div class="tableBox">

        <table>

        <tr>
            <th>#</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Narration</th>
        </tr>
    `;

    bank.forEach(function(e,i){

        html += `

        <tr>

            <td>${i+1}</td>

            <td>${formatDate(e.date)}</td>

            <td>₹${e.amount.toFixed(2)}</td>

            <td>${escapeHTML(e.type)}</td>

            <td>${escapeHTML(e.text)}</td>

        </tr>
        `;

    });

    html += `

        </table>

        </div>

    </div>
    `;


    document.getElementById(
        "result"
    ).innerHTML=html;
}


/* =====================================
   MAIN FUNCTION
===================================== */

async function startAnalysis(){

    var tallyFile =
        document.getElementById(
            "tallyFile"
        ).files[0];

    var bankFile =
        document.getElementById(
            "bankFile"
        ).files[0];

    var button =
        document.getElementById(
            "analyzeBtn"
        );

    document.getElementById(
        "result"
    ).innerHTML="";

    if(!tallyFile){

        showStatus(
            "❌ Pehle Tally PDF select karein.",
            "error"
        );

        return;
    }

    if(!bankFile){

        showStatus(
            "❌ Pehle Bank PDF select karein.",
            "error"
        );

        return;
    }

    button.disabled=true;

    button.innerText=
        "⏳ Analysis chal raha hai...";

    try{

        showStatus(
            "🚀 Analysis start ho gaya..."
        );

        var tallyText =
            await readPDF(
                tallyFile,
                "Tally"
            );

        var bankText =
            await readPDF(
                bankFile,
                "Bank"
            );

        if(!tallyText.trim()){

            throw new Error(
                "Tally PDF se text nahi mila. Ye scanned/image PDF ho sakti hai."
            );
        }

        if(!bankText.trim()){

            throw new Error(
                "Bank PDF se text nahi mila. Ye scanned/image PDF ho sakti hai."
            );
        }

        showStatus(
            "🔎 Tally entries detect ho rahi hain..."
        );

        var tallyEntries =
            detectTransactions(
                tallyText
            );

        showStatus(
            "🔎 Bank entries detect ho rahi hain..."
        );

        var bankEntries =
            detectTransactions(
                bankText
            );

        if(tallyEntries.length===0){

            throw new Error(
                "Tally PDF read hui, lekin transaction detect nahi hui."
            );
        }

        if(bankEntries.length===0){

            throw new Error(
                "Bank PDF read hui, lekin transaction detect nahi hui."
            );
        }

        showStatus(
            "⚡ Entries match ki ja rahi hain..."
        );

        var matched =
            matchEntries(
                tallyEntries,
                bankEntries
            );

        showResults(
            tallyEntries,
            bankEntries,
            matched
        );

        showStatus(
            "✅ Analysis complete!",
            "success"
        );

    }catch(error){

        console.error(error);

        showStatus(
            "❌ " + error.message,
            "error"
        );

    }finally{

        button.disabled=false;

        button.innerText=
            "🔍 Analyze & Match Entries";

    }
}

</script>

</body>
    </html>
