/* ==============================
   PDF TEXT EXTRACTION
================================ */

async function extractPDFText(file){

    if(!file){
        throw new Error("PDF file select nahi ki gayi.");
    }

    if(typeof pdfjsLib === "undefined"){
        throw new Error("PDF.js load nahi hua. Internet connection check karein.");
    }

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: arrayBuffer
    }).promise;

    let pages = [];
    let fullText = "";

    for(let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++){

        setStatus(
            "PDF read ho raha hai... Page " +
            pageNumber +
            " / " +
            pdf.numPages
        );

        const page = await pdf.getPage(pageNumber);

        const textContent = await page.getTextContent();

        const items = textContent.items || [];

        let lines = {};

        items.forEach(item => {

            const text = (item.str || "").trim();

            if(!text){
                return;
            }

            const y = Math.round(
                item.transform[5]
            );

            if(!lines[y]){
                lines[y] = [];
            }

            lines[y].push({
                x:item.transform[4],
                text:text
            });

        });

        const sortedY = Object.keys(lines)
            .map(Number)
            .sort((a,b)=>b-a);

        let pageText = "";

        sortedY.forEach(y => {

            lines[y].sort(
                (a,b)=>a.x-b.x
            );

            const line = lines[y]
                .map(x=>x.text)
                .join(" ");

            pageText += line + "\n";
        });

        pages.push(pageText);

        fullText +=
            "\n--- PAGE " +
            pageNumber +
            " ---\n" +
            pageText;
    }

    return {
        pages:pages,
        text:fullText
    };
}


/* ==============================
   STATUS
================================ */

function setStatus(message,type=""){

    const box =
        document.getElementById("status");

    box.style.display = "block";

    box.className = "status " + type;

    box.innerText = message;
}


/* ==============================
   DATE
================================ */

function extractDate(text){

    const patterns = [

        /(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/,

        /(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/

    ];

    for(const regex of patterns){

        const match = text.match(regex);

        if(match){

            let d,m,y;

            if(match[3].length === 4){

                d = Number(match[1]);
                m = Number(match[2]);
                y = Number(match[3]);

            }else{

                y = Number(match[1]);
                m = Number(match[2]);
                d = Number(match[3]);

            }

            if(
                d>=1 &&
                d<=31 &&
                m>=1 &&
                m<=12
            ){

                return new Date(
                    y,
                    m-1,
                    d
                );
            }
        }
    }

    return null;
}


/* ==============================
   AMOUNT
================================ */

function extractAmounts(text){

    const matches =
        text.match(
            /(?:₹|Rs\.?|INR)?\s*[\d,]+(?:\.\d{1,2})?/gi
        ) || [];

    let amounts = [];

    matches.forEach(value=>{

        let cleaned =
            value
            .replace(/[₹,\s]/g,"")
            .replace(/^Rs\.?/i,"")
            .replace(/^INR/i,"");

        const number =
            parseFloat(cleaned);

        if(
            !isNaN(number) &&
            number > 0
        ){
            amounts.push(number);
        }
    });

    return amounts;
}


/* ==============================
   TYPE
================================ */

function detectType(text){

    const t =
        text.toLowerCase();

    if(
        t.includes("withdraw") ||
        t.includes("debit") ||
        t.includes("dr") ||
        /\bby\b/i.test(text)
    ){
        return "DEBIT";
    }

    if(
        t.includes("deposit") ||
        t.includes("credit") ||
        t.includes("cr") ||
        /\bto\b/i.test(text)
    ){
        return "CREDIT";
    }

    return "";
}


/* ==============================
   TRANSACTION PARSER
================================ */

function buildTransactions(pages){

    let transactions = [];

    pages.forEach((pageText,pageIndex)=>{

        const lines =
            pageText
            .split(/\r?\n/)
            .map(x=>x.trim())
            .filter(Boolean);

        let current = null;

        lines.forEach(line=>{

            const date =
                extractDate(line);

            if(date){

                if(current){

                    finalizeTransaction(
                        current,
                        transactions
                    );
                }

                current = {

                    date:date,

                    dateText:
                        line.match(
                            /\d{1,4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,4}/
                        )?.[0] || "",

                    text:line,

                    page:pageIndex+1

                };

            }else if(current){

                current.text +=
                    " " + line;
            }

        });

        if(current){

            finalizeTransaction(
                current,
                transactions
            );
        }

    });

    return transactions;
}


function finalizeTransaction(
    current,
    transactions
){

    const amounts =
        extractAmounts(
            current.text
        );

    if(amounts.length === 0){
        return;
    }

    current.amount =
        amounts[amounts.length-1];

    current.type =
        detectType(current.text);

    transactions.push(current);
}


/* ==============================
   REMOVE DUPLICATES
================================ */

function removeDuplicates(entries){

    const seen = new Set();

    return entries.filter(e=>{

        const key =
            (e.dateText || "") +
            "|" +
            e.amount +
            "|" +
            e.text.substring(0,80);

        if(seen.has(key)){
            return false;
        }

        seen.add(key);

        return true;
    });
}


/* ==============================
   DATE DIFFERENCE
================================ */

function daysDifference(a,b){

    if(!a || !b){
        return 999;
    }

    const diff =
        Math.abs(
            a.getTime()-b.getTime()
        );

    return diff /
        (1000*60*60*24);
}


/* ==============================
   NARRATION SIMILARITY
================================ */

function similarity(a,b){

    const A =
        new Set(
            a
            .toLowerCase()
            .replace(/[^a-z0-9 ]/g," ")
            .split(/\s+/)
            .filter(x=>x.length>2)
        );

    const B =
        new Set(
            b
            .toLowerCase()
            .replace(/[^a-z0-9 ]/g," ")
            .split(/\s+/)
            .filter(x=>x.length>2)
        );

    if(
        A.size === 0 ||
        B.size === 0
    ){
        return 0;
    }

    let common = 0;

    A.forEach(word=>{
        if(B.has(word)){
            common++;
        }
    });

    return common /
        Math.max(A.size,B.size);
}


/* ==============================
   MATCHING
================================ */

function matchEntries(
    tallyEntries,
    bankEntries
){

    const results = [];

    const usedBank =
        new Set();

    tallyEntries.forEach(tally=>{

        let best = null;

        let bestScore = 0;

        bankEntries.forEach(
            (bank,index)=>{

                if(
                    usedBank.has(index)
                ){
                    return;
                }

                let score = 0;

                /* AMOUNT */

                if(
                    Math.abs(
                        tally.amount -
                        bank.amount
                    ) < 0.01
                ){
                    score += 60;
                }else{
                    return;
                }

                /* DATE */

                const diff =
                    daysDifference(
                        tally.date,
                        bank.date
                    );

                if(diff === 0){

                    score += 25;

                }else if(diff <= 2){

                    score += 15;
                }

                /* TYPE */

                if(
                    tally.type &&
                    bank.type &&
                    tally.type === bank.type
                ){
                    score += 10;
                }

                /* NARRATION */

                const sim =
                    similarity(
                        tally.text,
                        bank.text
                    );

                if(sim >= .30){
                    score += 5;
                }

                if(score > bestScore){

                    bestScore = score;

                    best = {
                        bank:bank,
                        index:index,
                        score:score
                    };
                }

            }
        );

        if(best){

            usedBank.add(
                best.index
            );

            let status;

            if(bestScore >= 80){

                status = "MATCHED";

            }else if(bestScore >= 60){

                status = "POSSIBLE";

            }else{

                status = "MISSING";
            }

            results.push({

                tally:tally,

                bank:best.bank,

                score:bestScore,

                status:status

            });

        }else{

            results.push({

                tally:tally,

                bank:null,

                score:0,

                status:"MISSING"

            });
        }

    });


    /* EXTRA BANK ENTRIES */

    const extraBank =
        bankEntries.filter(
            (bank,index)=>
                !usedBank.has(index)
        );

    return {
        results:results,
        extraBank:extraBank
    };
}


/* ==============================
   FORMAT DATE
================================ */

function formatDate(date){

    if(!date){
        return "-";
    }

    return String(
        date.getDate()
    ).padStart(2,"0")
    + "/" +
    String(
        date.getMonth()+1
    ).padStart(2,"0")
    + "/" +
    date.getFullYear();
}


/* ==============================
   ESCAPE HTML
================================ */

function esc(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

            </div>

        <br>

            <div class="box">

            </div>

                <strong>${missing}</strong>
            </div>

            <div class="box">

    </div>


    <div class="card">

        <h2>📋 Tally vs Bank</h2>

        <div class="table-wrap">

        <table>

        <tr>

            <th>Score</th>
        </tr>

        </thead>

        <tbody>
    `;

    matching.results.forEach(
        (r,i)=>{

            let cls =
                r.status==="MATCHED"
                ? "match"
                : r.status==="POSSIBLE"

                </td>

                    ${
                        r.bank
                        ? formatDate(r.bank.date)
                        : "-"
                    }

                <td class="${cls}">
                    ${r.status}

                <td>

            </tr>

            `;
        }
    );

    html += `

    </div>
    `;


    if(matching.extraBank.length){

        html += `

        <div class="card">

        <h2>⚠️ Extra Entries in Bank</h2>

        <div class="table-wrap">

        <table>

        <thead>

        <tr>
            <th>#</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Narration</th>
        </tr>

        </thead>

        <tbody>
        `;

        matching.extraBank.forEach(
            (entry,i)=>{

                html += `

                <tr>

                    <td>${i+1}</td>

                    <td>
                        ${formatDate(entry.date)}
                    </td>

                    <td>
                        ₹${entry.amount.toFixed(2)}
                    </td>

                    <td>
                        ${esc(entry.type)}
                    </td>

                    <td>
                        ${esc(entry.text)}
                    </td>

                </tr>

                `;
            }
        );

        html += `
        </tbody>
        </table>
        </div>
        </div>
        `;
    }


    document.getElementById(
        "result"
    ).innerHTML = html;
}
